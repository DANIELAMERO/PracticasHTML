
<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contacto</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#071c21;
    color:white;
}

header{

    position:fixed;

    top:0;

    width:100%;

    padding:25px 80px;

    display:flex;

    justify-content:space-between;

    align-items:center;

    background:rgba(4,25,29,.80);

    backdrop-filter:blur(10px);

    z-index:100;

    border-bottom:1px solid rgba(45,212,191,.15);
}

.logo{

    font-size:30px;

    font-weight:bold;
}

nav a{

    color:white;

    text-decoration:none;

    margin-left:30px;

    transition:.3s;
}

nav a:hover{

    color:#2dd4bf;
}
.banner{

    height:45vh;

    background:
    linear-gradient(
        rgba(0,25,30,.45),
        rgba(0,25,30,.65)
    ),

    url("https://tse4.mm.bing.net/th/id/OIP.XRGKyVKOYfk5QXl0j4EshgHaDt?cb=thfvnextfalcon2&rs=1&pid=ImgDetMain&o=7&rm=3")
    center/cover;

    display:flex;

    justify-content:center;

    align-items:center;

    position:relative;
}

.banner::before{

    content:"";

    position:absolute;

    inset:0;

    background:rgba(0,25,30,.25);
}

.banner h1{

    position:relative;

    font-size:60px;

    z-index:2;
}


.contenedor{

    display:flex;

    justify-content:center;

    padding:70px;

    background:#071c21;
}

.formulario{

    width:600px;

    background:#102c31;

    padding:40px;

    border-radius:20px;

    border:1px solid rgba(45,212,191,.12);

    box-shadow:
    0 15px 40px rgba(0,0,0,.30);
}

.formulario h2{

    margin-bottom:30px;

    text-align:center;

    font-size:28px;
}


input,
textarea{

    width:100%;

    padding:15px;

    margin-bottom:20px;

    border:2px solid transparent;

    border-radius:10px;

    font-size:16px;

    background:#e8f1f2;

    color:#062b30;

    outline:none;

    transition:.3s;
}

input:focus,
textarea:focus{

    border-color:#2dd4bf;

    background:white;
}

textarea{

    resize:none;

    height:180px;
}


button{

    width:100%;

    padding:15px;

    border:none;

    border-radius:30px;

    background:#2dd4bf;

    color:#062b30;

    font-size:17px;

    font-weight:bold;

    cursor:pointer;

    transition:.3s;
}

button:hover{

    background:#fb7185;

    color:white;

    transform:translateY(-2px);
}

footer{

    background:#041417;

    padding:25px;

    text-align:center;

    color:#8fa7aa;

    border-top:
    1px solid rgba(45,212,191,.1);
}


@media(max-width:800px){

    header{

        padding:20px 30px;
    }

    .logo{

        font-size:22px;
    }

    nav a{

        margin-left:12px;

        font-size:13px;
    }

    .banner{

        height:40vh;
    }

    .banner h1{

        font-size:45px;
    }

    .contenedor{

        padding:50px 25px;
    }

    .formulario{

        width:100%;

        padding:30px;
    }

}

</style>

</head>


<body>

<header>

<div class="logo">

Destinos Turísticos

</div>

<nav>

<a href="index.html">
Inicio
</a>

<a href="viajes.html">
Viajes
</a>

<a href="contactos.html">
Contacto
</a>

</nav>

</header>


<section class="banner">

<h1>
Contacto
</h1>

</section>

<div class="contenedor">

<div class="formulario">

<h2>
Envíanos un mensaje
</h2>

<form>

<input
type="text"
placeholder="Nombre"
>

<input
type="email"
placeholder="Correo electrónico"
>

<textarea
placeholder="Escribe tu mensaje">
</textarea>

<button type="submit">

Enviar mensaje

</button>

</form>

</div>

</div>


<footer>

© 2026 Destinos Turísticos

</footer>


</body>

</html>
```
